[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-helper"
version = "0.3.0"
description = "可追溯的中文 A 股投研、数据审计和量化研究助手"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
data = ["akshare>=1.17,<2", "tushare>=1.4,<2", "baostock>=0.8,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
astock = "astock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
